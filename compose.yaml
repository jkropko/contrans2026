# Local development only. Render deploys from the Dockerfile and
# provides its own database connection.

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8050:8050"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
