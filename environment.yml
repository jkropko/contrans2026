name: ds6600
channels:
  - conda-forge
  - nodefaults
dependencies:
  # ---- interpreter -------------------------------------------------------
  # 3.14 on the laptop. The Dockerfile deliberately uses python:3.12-slim so
  # 9/8 can show a container running a different interpreter than the host.
  - python=3.14
  - pip
  - ipykernel

  # ---- core (1, 3, 14, 15) -----------------------------------------------
  - pandas
  - numpy

  # ---- HTTP: APIs, caching, backoff (9/22, 9/24) -------------------------
  - requests
  - requests-cache
  - tenacity

  # ---- flat files and Parquet (9/17, Lab 3) ------------------------------
  - pyarrow
  - openpyxl
  - pyreadstat        # pandas.read_spss; Stata and SAS are already native

  # ---- crosswalk YAML (10/1) ---------------------------------------------
  - pyyaml

  # ---- scraping and GPO bulk XML (9/29, 11/10) ---------------------------
  - beautifulsoup4
  - lxml

  # ---- entity resolution (10/8) ------------------------------------------
  - rapidfuzz

  # ---- databases (9/10, 10/22, 10/27, 10/29) -----------------------------
  # psycopg is v3 on conda-forge. SQLAlchemy URL: postgresql+psycopg://
  - sqlalchemy>=2.0
  - psycopg
  - duckdb

  # ---- analysis (11/5, 11/17) --------------------------------------------
  - scipy
  - scikit-learn

  # ---- visualization (8/27, 11/17, 11/19) --------------------------------
  # matplotlib-base skips the Qt GUI stack; seaborn and plotly don't need it.
  - matplotlib-base
  - seaborn
  - plotly
  - nbformat          # plotly needs this to render inside a notebook
  - dash

  # ---- pipeline: orchestration, validation, tests (11/10, 11/12) ---------
  - prefect>=3
  - pandera
  - pytest

  # ---- dashboard caching and secrets (12/1) ------------------------------
  - flask-caching
  - python-dotenv

# NOT here on purpose:
#   gunicorn        - no Windows build; lives in the image's requirements.txt
#   playwright, selenium - add per-student in September if a Part B source
#                          turns out to render client-side
#   redis, airflow, dagster, recordlinkage, splink
#   sqlite3         - standard library
#   dbdocs          - npm, not conda